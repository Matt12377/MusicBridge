name: Rust Core 只读原型

on:
  push:
    paths:
      - '*'
      - 'packages/**'
      - 'apps/**'
      - 'native/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'tasks/**'
      - 'docs/adr/**'
      - 'docs/postrust/RUST-*/**'
      - 'docs/postrust/MBRS-000/**'
  pull_request:
    paths:
      - '*'
      - 'packages/**'
      - 'apps/**'
      - 'native/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'tasks/**'
      - 'docs/adr/**'
      - 'docs/postrust/RUST-*/**'
      - 'docs/postrust/MBRS-000/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: V3.9 Tape组合精确身份准入
        id: v39-integration
        run: node scripts/ci/v39-integration-admission.mjs --workflow-guard

      - name: CI报告元数据精确身份与原软件复用准入
        id: ci-metadata
        if: steps.v39-integration.outputs.integrationMode != 'qualified'
        run: node scripts/ci/ci-report-metadata-admission.mjs --workflow-guard
      - name: CI修复精确身份与原软件复用准入
        id: ci-repair
        if: steps.v39-integration.outputs.integrationMode != 'qualified' && steps.ci-metadata.outputs.repairMode != 'reuse-s165'
        run: node scripts/ci/ci-report-mirror-admission.mjs --workflow-guard
      - name: 复用165已封存产品软件证据
        if: steps.v39-integration.outputs.integrationMode != 'qualified' && (steps.ci-metadata.outputs.repairMode == 'reuse-s165' || steps.ci-repair.outputs.repairMode == 'reuse-s165')
        run: echo 'REUSED_S165=true；Rust工具链、依赖安装、编译及TS/Rust产品Gate均为SKIPPED_REUSED_S165。'
      - name: 判定本次精确父Source产品CI复用
        id: ci-mode
        if: steps.v39-integration.outputs.integrationMode == 'qualified' && steps.v39-integration.outputs.integrationRole == 'report'
        run: node scripts/ci/report-only-admission.mjs

      - name: 复用本次精确父Source产品软件证据
        if: steps.v39-integration.outputs.integrationMode == 'qualified' && steps.v39-integration.outputs.integrationRole == 'report' && steps.ci-mode.outputs.mode == 'report-only'
        run: echo 'REUSED_EXACT_CURRENT_PARENT_SOURCE=true；本次产品编译与产品Gate未重跑，当前报告组合Gate与安全检查独立执行。'

      - name: 准备真实hosted专用构建根
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test -d "$RUNNER_TEMP"
          umask 077
          mkdir -p "$RUNNER_TEMP/musicbridge-rust-core/tmp" "$RUNNER_TEMP/musicbridge-rust-core/cache"
          chmod 700 "$RUNNER_TEMP/musicbridge-rust-core/tmp"
          printf 'TMPDIR=%s\nDEV_CACHE_ROOT=%s\nMUSIC_BRIDGE_RUST_GATE_DIR=%s\n' "$RUNNER_TEMP/musicbridge-rust-core/tmp" "$RUNNER_TEMP/musicbridge-rust-core/cache" "$RUNNER_TEMP/musicbridge-rust-core" >> "$GITHUB_ENV"
          printf 'COREPACK_HOME=%s\nnpm_config_cache=%s\nELECTRON_CACHE=%s\nelectron_config_cache=%s\nXDG_CACHE_HOME=%s\n' "$RUNNER_TEMP/musicbridge-rust-core/cache/corepack" "$RUNNER_TEMP/musicbridge-rust-core/cache/npm" "$RUNNER_TEMP/musicbridge-rust-core/cache/Electron" "$RUNNER_TEMP/musicbridge-rust-core/cache/Electron" "$RUNNER_TEMP/musicbridge-rust-core/cache" >> "$GITHUB_ENV"
      - name: 安装固定 Rust 工具链
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: 安装冻结工作区依赖
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts
      - name: 验证实际 Rust 与 TypeScript 边界
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        run: corepack pnpm@10.17.1 run verify:rust
      - name: 保留编译器、测试及源码与二进制清单
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && always() && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/musicbridge-rust-core/**/*.json
            ${{ runner.temp }}/musicbridge-rust-core/**/*.log
          if-no-files-found: warn
          retention-days: 14
