name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Prepare strict hosted verification directories
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test -d "$RUNNER_TEMP"
          umask 077
          mkdir -p "$RUNNER_TEMP/musicbridge-verify/tmp" "$RUNNER_TEMP/musicbridge-verify/cache"
          chmod 700 "$RUNNER_TEMP/musicbridge-verify/tmp"
          printf 'TMPDIR=%s\nDEV_CACHE_ROOT=%s\n' "$RUNNER_TEMP/musicbridge-verify/tmp" "$RUNNER_TEMP/musicbridge-verify/cache" >> "$GITHUB_ENV"
          printf 'COREPACK_HOME=%s\nnpm_config_cache=%s\nELECTRON_CACHE=%s\nelectron_config_cache=%s\nXDG_CACHE_HOME=%s\n' "$RUNNER_TEMP/musicbridge-verify/cache/corepack" "$RUNNER_TEMP/musicbridge-verify/cache/npm" "$RUNNER_TEMP/musicbridge-verify/cache/Electron" "$RUNNER_TEMP/musicbridge-verify/cache/Electron" "$RUNNER_TEMP/musicbridge-verify/cache" >> "$GITHUB_ENV"

      - name: 判定精确父源码CI可复用的报告提交
        id: ci-mode
        run: node scripts/ci/report-only-admission.mjs

      - name: Prepare source-pinned build workspace mirror
        run: node scripts/ci/prepare-build-workspace-mirror.mjs --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/musicbridge-verify/workspace" --expected-head "${{ github.sha }}"

      - name: Install frozen workspace
        if: steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Validate control plane
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/verify-control-plane.mjs

      - name: Validate security and product boundaries
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/verify-boundaries.mjs

      - name: Scan workspace import cycles
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/verify-cycles.mjs

      - name: Verify platform-independent workspace (typecheck, unit tests, build; no Electron)
        if: steps.ci-mode.outputs.mode != 'report-only'
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/musicbridge-verify"
          corepack pnpm@10.17.1 verify 2>&1 | tee "$RUNNER_TEMP/musicbridge-verify/verify.log"

      - name: Verify offline preparation boundaries
        if: steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node --test scripts/ci/test/build-storage-root.test.mjs scripts/ci/test/rust016-workflow-context.test.mjs scripts/ci/test/rust-electron-host-receipt.test.mjs scripts/ci/test/electron-archive-tree.test.mjs scripts/ci/test/electron-preparation-order.test.mjs scripts/ci/test/rust-host-gate-cli.test.mjs scripts/ci/test/rust-private-host-environment.test.mjs

      - name: Verify isolated MBRS-001 offline POC
        if: steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/verify-mbrs001-offline.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs001-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS002 本地合同 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node scripts/ci/verify-mbrs002-contracts.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs002-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS003 阶段软件 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs003-scan.test.mjs scripts/ci/test/mbrs003-owner-stage-scale.test.mjs scripts/ci/test/metadata-reader-fixed-bundle-v2.test.mjs scripts/ci/test/mbrs003-scale-new-round-receipts.test.mjs
          node scripts/ci/verify-mbrs003-scan.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs003-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS004 名称与版本规则 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs004-rules.test.mjs
          node scripts/ci/verify-mbrs004-rules.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs004-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS005 本地文件网关与资源租约 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs005-gateway.test.mjs
          node scripts/ci/verify-mbrs005-gateway.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs005-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS006 本地Audio Input与会话隔离 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs006-local-playback.test.mjs scripts/ci/test/run-core-tests.test.mjs
          node scripts/ci/verify-mbrs006-local-playback.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs006-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS007 队列预取与持久恢复 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs007-queue.test.mjs
          node scripts/ci/verify-mbrs007-queue.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs007-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS008 原样字节与独立质量证据 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs008-audio.test.mjs
          node scripts/ci/verify-mbrs008-audio.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs008-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS009 正式本地库有界查询与复用UI Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs009-local-library-ui.test.mjs
          node scripts/ci/verify-mbrs009-local-library-ui.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs009-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS010 封面选择与来源安全 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs010-artwork.test.mjs
          node scripts/ci/verify-mbrs010-artwork.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs010-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS011 MB_ONLY信息整理预览与撤销 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs011-organizer.test.mjs
          node scripts/ci/verify-mbrs011-organizer.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs011-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS014 旧收藏关联与冻结来源保护 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs014-compatibility.test.mjs
          node scripts/ci/verify-mbrs014-compatibility.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs014-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS012 受控源写与备份恢复 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/mbrs013-legacy-input-normalization.test.mjs
          node --test scripts/ci/test/verify-mbrs012-source-writes.test.mjs
          node scripts/ci/verify-mbrs012-source-writes.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs012-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBRS013 同内容位置迁移与具体清理 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbrs013-relocation.test.mjs scripts/ci/test/verify-mbrs013-frozen-admission.test.mjs
          node scripts/ci/verify-mbrs013-relocation.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbrs013-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBM000 移动合同双端采纳 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbm000-contract-adoption.test.mjs scripts/ci/test/mbm000-legacy-probe-normalization.test.mjs scripts/ci/test/mbm001-legacy-reuse-normalization.test.mjs
          node scripts/ci/verify-mbm000-contract-adoption.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbm000-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: MBM001 配对与只读曲库 Gate
        if: steps.ci-mode.outputs.mode != 'report-only'
        timeout-minutes: 10
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --test scripts/ci/test/verify-mbm001-pairing-library.test.mjs scripts/ci/test/mbm001-legacy-probe-normalization.test.mjs
          node scripts/ci/verify-mbm001-pairing-library.mjs --output-root="$RUNNER_TEMP/musicbridge-verify/mbm001-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: 验证报告CI准入正负例
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node --test scripts/ci/test/report-only-admission.test.mjs scripts/ci/test/mbm000-report-only-admission.test.mjs scripts/ci/test/mbm001-report-only-admission.test.mjs

      - name: Diff whitespace
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: git diff --check && git diff HEAD^ HEAD --check

      - name: Verify pinned historical fragments and current discarded rejection
        if: steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}/apps/desktop
        run: node --import tsx --test --test-name-pattern='成本05实际|Source08原settings|当前合法settings完整选择' test/rust-core/collection-scale-cost.test.ts test/rust-core/collection-scale-evidence.test.ts

      - name: Preserve full verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.sha }}
          path: |
            ${{ runner.temp }}/musicbridge-verify/
            !${{ runner.temp }}/musicbridge-verify/workspace/**
            !${{ runner.temp }}/musicbridge-verify/**/tmp/**
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Prepare source-pinned build workspace mirror
        run: node scripts/ci/prepare-build-workspace-mirror.mjs --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/musicbridge-dependency-audit/workspace" --expected-head "${{ github.sha }}"

      - name: Install frozen workspace
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Production dependency audit
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: corepack pnpm@10.17.1 audit --prod --audit-level high --registry https://registry.npmjs.org
