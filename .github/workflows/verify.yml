name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frozen workspace
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Validate control plane
        run: node scripts/ci/verify-control-plane.mjs

      - name: Validate security and product boundaries
        run: node scripts/ci/verify-boundaries.mjs

      - name: Scan workspace import cycles
        run: node scripts/ci/verify-cycles.mjs

      - name: Verify workspace
        run: corepack pnpm@10.17.1 verify

      - name: Synthetic Electron startup and Core crash recovery
        run: xvfb-run --auto-servernum corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:startup

      - name: Production dependency audit
        run: corepack pnpm@10.17.1 audit --prod --audit-level high

      - name: Diff whitespace
        run: git diff --check
