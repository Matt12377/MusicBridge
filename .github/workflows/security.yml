name: security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frozen workspace
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Validate machine control state
        run: node scripts/ci/verify-control-plane.mjs

      - name: Run boundary, loopback, secret and URL/query scans
        run: node scripts/ci/verify-boundaries.mjs

      - name: Scan workspace import cycles
        run: node scripts/ci/verify-cycles.mjs

      - name: Run security-focused tests
        run: corepack pnpm@10.17.1 --filter @music-bridge/desktop test

      - name: Production dependency audit
        run: corepack pnpm@10.17.1 audit --prod --audit-level high
