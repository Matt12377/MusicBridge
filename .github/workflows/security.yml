name: security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: CI修复精确身份与原软件复用准入
        id: ci-repair
        run: node scripts/ci/ci-report-mirror-admission.mjs --workflow-guard

      - name: 复用165已封存产品软件证据
        if: steps.ci-repair.outputs.repairMode == 'reuse-s165'
        run: echo 'REUSED_S165=true；依赖安装及原定向产品测试为SKIPPED_REUSED_S165，当前控制、边界和循环检查独立执行。'

      - name: Install frozen workspace
        if: steps.ci-repair.outputs.repairMode != 'reuse-s165'
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Validate machine control state
        run: node scripts/ci/verify-control-plane.mjs

      - name: Run boundary, loopback, secret and URL/query scans
        run: node scripts/ci/verify-boundaries.mjs

      - name: Scan workspace import cycles
        run: node scripts/ci/verify-cycles.mjs

      - name: Run directed platform-independent security tests (no Electron)
        if: steps.ci-repair.outputs.repairMode != 'reuse-s165'
        run: corepack pnpm@10.17.1 test:security
