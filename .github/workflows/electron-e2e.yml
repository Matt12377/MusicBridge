name: electron-e2e

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/bridge-core/**'
      - 'packages/contracts/**'
      - '.github/workflows/electron-e2e.yml'

permissions:
  contents: read

jobs:
  macos-electron-gate:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frozen workspace
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Install Electron binary from locked tree (official installer only)
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      - name: Electron startup, crash/restart, safeStorage vault and credential recovery gates
        run: corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:electron

      - name: Electron end-to-end flow (Playwright, production build)
        run: corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:e2e
