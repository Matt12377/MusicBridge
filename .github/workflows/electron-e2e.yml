name: electron-e2e

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/bridge-core/**'
      - 'packages/contracts/**'
      - 'native/rust-core/**'
      - 'scripts/ci/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/electron-e2e.yml'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  macos-electron-gate:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare hosted runner evidence directories
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$GITHUB_ACTIONS" = "true"
          test -d "$RUNNER_TEMP"
          umask 077
          mkdir -p "$RUNNER_TEMP/musicbridge-electron/tmp" "$RUNNER_TEMP/musicbridge-electron/results" "$RUNNER_TEMP/musicbridge-electron/cache" "$RUNNER_TEMP/musicbridge-rust-core"
          chmod 700 "$RUNNER_TEMP/musicbridge-electron/tmp"
          printf 'TMPDIR=%s\nMUSIC_BRIDGE_E2E_OUTPUT_DIR=%s\nDEV_CACHE_ROOT=%s\nMUSIC_BRIDGE_RUST_GATE_DIR=%s\n' "$RUNNER_TEMP/musicbridge-electron/tmp" "$RUNNER_TEMP/musicbridge-electron/results" "$RUNNER_TEMP/musicbridge-electron/cache" "$RUNNER_TEMP/musicbridge-rust-core" >> "$GITHUB_ENV"
          printf 'COREPACK_HOME=%s\nnpm_config_cache=%s\nELECTRON_CACHE=%s\nelectron_config_cache=%s\nXDG_CACHE_HOME=%s\n' "$RUNNER_TEMP/musicbridge-electron/cache/corepack" "$RUNNER_TEMP/musicbridge-electron/cache/npm" "$RUNNER_TEMP/musicbridge-electron/cache/Electron" "$RUNNER_TEMP/musicbridge-electron/cache/Electron" "$RUNNER_TEMP/musicbridge-electron/cache" >> "$GITHUB_ENV"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Prepare source-pinned build workspace mirror
        run: node scripts/ci/prepare-build-workspace-mirror.mjs --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/musicbridge-electron/workspace" --expected-head "${{ github.sha }}"

      - name: Install frozen workspace
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Prepare fresh Core fixed Worker before existing Electron gates
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: corepack pnpm@10.17.1 --filter @music-bridge/contracts run build && corepack pnpm@10.17.1 --filter @music-bridge/bridge-core run build

      - name: Prepare Rust toolchain
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Build and verify both Rust hosts once in this job
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/prepare-rust-electron-hosts.mjs
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'

      - name: Install Electron binary from locked tree (official installer only)
        run: |
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "官方Electron安装器第${attempt}次未完成，15秒后进行下一次有限尝试。"
              sleep 15
            fi
          done
          echo "官方Electron安装器三次均未完成，停止并保留失败记录。" >&2
          exit 1
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}/apps/desktop

      - name: Verify official Electron archive and actual execution tree
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node apps/desktop/scripts/prepare-electron-identity.mjs

      - name: Electron startup, crash/restart, safeStorage vault and credential recovery gates
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -o pipefail
          export MUSIC_BRIDGE_RUST_ELECTRON_REPORT="$MUSIC_BRIDGE_RUST_MAIN_HOST_BUILD_ROOT/electron-report.json"
          export MUSIC_BRIDGE_RUST_COLLECTION_ELECTRON_REPORT="$MUSIC_BRIDGE_RUST_COLLECTION_HOST_BUILD_ROOT/electron-report.json"
          corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:electron 2>&1 | tee "$RUNNER_TEMP/musicbridge-electron/electron-gates.log"

      - name: Electron end-to-end flow (Playwright, production build)
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -o pipefail
          corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:e2e 2>&1 | tee "$RUNNER_TEMP/musicbridge-electron/electron-e2e.log"

      # 仅从本次成功移交收据选择已声明产物；不扫描宿主根或依赖链接。
      - name: Select declared synthetic Rust Host artifacts
        id: rust-host-artifacts
        if: ${{ always() && env.MUSIC_BRIDGE_RUST_HOSTS_RECEIPT != '' }}
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, realpathSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          import { randomUUID } from 'node:crypto';
          import { readRustElectronHostsReceipt } from './scripts/ci/rust-electron-host-receipt.mjs';
          try {
            const receiptPath = process.env.MUSIC_BRIDGE_RUST_HOSTS_RECEIPT;
            const receipt = readRustElectronHostsReceipt(receiptPath, realpathSync('.'));
            const files = [receiptPath, receipt.manifestPath];
            for (const root of [receipt.mainHostBuildRoot, receipt.collectionHostBuildRoot]) {
              const manifestPath = path.join(root, 'artifact-manifest.json');
              const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
              files.push(manifestPath, ...manifest.artifacts.map(item => path.join(root, item.path)));
            }
            const unique = [...new Set(files)];
            for (const file of unique) {
              // upload-artifact 会解释通配符；拒绝它们以保持逐文件声明闭集。
              if ([...'*?[]{}!\r\n\0'].some(char => file.includes(char))) throw new Error('不规范路径');
            }
            const delimiter = 'MB_HOST_ARTIFACTS_' + randomUUID().replaceAll('-', '');
            appendFileSync(process.env.GITHUB_OUTPUT, `paths<<${delimiter}\n${unique.join('\n')}\n${delimiter}\n`);
            console.log(`已选择 ${unique.length} 个本轮声明文件。`);
          } catch {
            console.error('本轮合成宿主产物闭集未确认，拒绝上传编译产物。');
            process.exitCode = 1;
          }
          NODE

      - name: Preserve declared synthetic Rust Host compiled artifacts
        if: ${{ always() && steps.rust-host-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-host-compiled-${{ github.sha }}
          path: ${{ steps.rust-host-artifacts.outputs.paths }}
          # 只对逐文件声明的专属artifact启用，避免扩大原logs/cache上传范围。
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Electron logs and synthetic test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/musicbridge-electron/
            !${{ runner.temp }}/musicbridge-electron/workspace/**
            ${{ runner.temp }}/musicbridge-rust-core/**/*.json
            ${{ runner.temp }}/musicbridge-rust-core/**/*.log
          if-no-files-found: warn
          retention-days: 14
