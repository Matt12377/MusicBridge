name: electron-e2e

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/bridge-core/**'
      - 'packages/contracts/**'
      - '.github/workflows/electron-e2e.yml'

permissions:
  contents: read

jobs:
  macos-electron-gate:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare hosted runner evidence directories
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/musicbridge-electron/tmp" "$RUNNER_TEMP/musicbridge-electron/results"
          printf 'TMPDIR=%s\nMUSIC_BRIDGE_E2E_OUTPUT_DIR=%s\n' "$RUNNER_TEMP/musicbridge-electron/tmp" "$RUNNER_TEMP/musicbridge-electron/results" >> "$GITHUB_ENV"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frozen workspace
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Install Electron binary from locked tree (official installer only)
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      - name: Electron startup, crash/restart, safeStorage vault and credential recovery gates
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:electron 2>&1 | tee "$RUNNER_TEMP/musicbridge-electron/electron-gates.log"

      - name: Electron end-to-end flow (Playwright, production build)
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:e2e 2>&1 | tee "$RUNNER_TEMP/musicbridge-electron/electron-e2e.log"

      - name: Preserve Electron logs and synthetic test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/musicbridge-electron/
          if-no-files-found: warn
          retention-days: 14
