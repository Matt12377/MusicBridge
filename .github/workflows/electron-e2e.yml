name: electron-e2e

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/bridge-core/**'
      - 'packages/contracts/**'
      - 'native/rust-core/**'
      - 'scripts/ci/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/electron-e2e.yml'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  macos-electron-gate:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare hosted runner evidence directories
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$GITHUB_ACTIONS" = "true"
          test -d "$RUNNER_TEMP"
          umask 077
          mkdir -p "$RUNNER_TEMP/musicbridge-electron/tmp" "$RUNNER_TEMP/musicbridge-electron/results" "$RUNNER_TEMP/musicbridge-electron/cache" "$RUNNER_TEMP/musicbridge-rust-core"
          chmod 700 "$RUNNER_TEMP/musicbridge-electron/tmp"
          printf 'TMPDIR=%s\nMUSIC_BRIDGE_E2E_OUTPUT_DIR=%s\nDEV_CACHE_ROOT=%s\nMUSIC_BRIDGE_RUST_GATE_DIR=%s\n' "$RUNNER_TEMP/musicbridge-electron/tmp" "$RUNNER_TEMP/musicbridge-electron/results" "$RUNNER_TEMP/musicbridge-electron/cache" "$RUNNER_TEMP/musicbridge-rust-core" >> "$GITHUB_ENV"
          printf 'COREPACK_HOME=%s\nnpm_config_cache=%s\nELECTRON_CACHE=%s\nelectron_config_cache=%s\nXDG_CACHE_HOME=%s\n' "$RUNNER_TEMP/musicbridge-electron/cache/corepack" "$RUNNER_TEMP/musicbridge-electron/cache/npm" "$RUNNER_TEMP/musicbridge-electron/cache/Electron" "$RUNNER_TEMP/musicbridge-electron/cache/Electron" "$RUNNER_TEMP/musicbridge-electron/cache" >> "$GITHUB_ENV"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: V3.9 完整集成精确身份准入
        id: v39-complete
        run: node scripts/ci/v39-integration-002-admission.mjs --workflow-guard

      - name: V3.9 Tape组合精确身份准入
        id: v39-integration
        if: steps.v39-complete.outputs.integrationMode != 'qualified'
        run: node scripts/ci/v39-integration-admission.mjs --workflow-guard

      - name: CI报告元数据精确身份与原软件复用准入
        id: ci-metadata
        if: steps.v39-complete.outputs.integrationMode != 'qualified' && (steps.v39-integration.outputs.integrationMode != 'qualified')
        run: node scripts/ci/ci-report-metadata-admission.mjs --workflow-guard

      - name: CI修复精确身份与原软件复用准入
        id: ci-repair
        if: steps.v39-complete.outputs.integrationMode != 'qualified' && (steps.v39-integration.outputs.integrationMode != 'qualified' && steps.ci-metadata.outputs.repairMode != 'reuse-s165')
        run: node scripts/ci/ci-report-mirror-admission.mjs --workflow-guard

      - name: 复用165已封存产品软件证据
        if: steps.v39-complete.outputs.integrationMode != 'qualified' && (steps.v39-integration.outputs.integrationMode != 'qualified' && (steps.ci-metadata.outputs.repairMode == 'reuse-s165' || steps.ci-repair.outputs.repairMode == 'reuse-s165'))
        run: echo 'REUSED_S165=true；产品与Worker编译、Rust Host、Electron下载/安装、App与原E2E均为SKIPPED_REUSED_S165。'

      - name: Prepare source-pinned build workspace mirror
        run: node scripts/ci/prepare-build-workspace-mirror.mjs --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/musicbridge-electron/workspace" --expected-head "${{ github.sha }}"

      - name: 判定本次精确父Source产品CI复用
        id: ci-mode
        if: (steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'report' || steps.v39-integration.outputs.integrationMode == 'qualified' && steps.v39-integration.outputs.integrationRole == 'report')
        run: node scripts/ci/report-only-admission.mjs

      - name: 复用本次精确父Source产品软件证据
        if: (steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'report' || steps.v39-integration.outputs.integrationMode == 'qualified' && steps.v39-integration.outputs.integrationRole == 'report') && steps.ci-mode.outputs.mode == 'report-only'
        run: echo 'REUSED_EXACT_CURRENT_PARENT_SOURCE=true；本次产品编译与产品Gate未重跑，当前报告组合Gate与安全检查独立执行。'

      - name: Install frozen workspace
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: corepack pnpm@10.17.1 install --frozen-lockfile --ignore-scripts

      - name: Prepare fresh Core fixed Worker before existing Electron gates
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        shell: bash
        run: |
          if [ '${{ steps.v39-complete.outputs.integrationMode }}' = 'qualified' ] && [ '${{ steps.v39-complete.outputs.integrationRole }}' = 'source' ]; then
            node --input-type=module <<'NODE'
          import { appendFileSync,writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { prepareCoreTestEnvironment } from './scripts/ci/run-core-tests.mjs';
          import { makeCueBinding } from './scripts/ci/verify-mbrs003-scan.mjs';
          const prepared=await prepareCoreTestEnvironment();
          const stage=prepared.receipt.stages.find(row=>row.name==='fresh-core-compiler');
          if(!stage||stage.compilerExit!==0)throw new Error('当前Core实际编译缺失，不派发正常扫描Native链。');
          const cue=makeCueBinding(prepared.receipt.sourceInputs,{compilerExit:0,compilerStartedAtMs:stage.startedMs,
            compilerFinishedAtMs:stage.finishedMs,outputs:prepared.receipt.outputs.filter(row=>row.sourceSha256&&row.path.startsWith('packages/bridge-core/'))});
          const cuePath=path.join(prepared.privateRoot,'cue-build-binding.json');writeFileSync(cuePath,JSON.stringify(cue,null,2)+'\n',{flag:'wx',mode:0o600});
          prepared.assertCurrent();
          appendFileSync(process.env.GITHUB_ENV,'MBRS003_READER_BUILD_BINDING='+prepared.env.MBRS003_READER_BUILD_BINDING+'\nMBRS003_CUE_BUILD_BINDING='+cuePath+'\n');
          NODE
          else
            corepack pnpm@10.17.1 --filter @music-bridge/contracts run build && corepack pnpm@10.17.1 --filter @music-bridge/bridge-core run build
          fi

      - name: 准备V3.9 固定Native源码与公共签名
        if: steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'source'
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}/packages/bridge-core
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'
          node --import tsx/esm --input-type=module <<'NODE'
          import { mkdirSync, existsSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          import { CUE_NATIVE_SOURCE_INPUTS } from './src/library/cue-ffmpeg-build-policy.ts';
          import { readV39Integration002Whole } from '../../scripts/ci/v39-integration-002-admission.mjs';
          const root=path.join(process.env.RUNNER_TEMP,'musicbridge-native-inputs');
          mkdirSync(root,{mode:0o700});
          const rows=[...CUE_NATIVE_SOURCE_INPUTS,
            {archive:'taglib-2.3.2.tar.gz',url:'https://taglib.org/releases/taglib-2.3.2.tar.gz',bytes:1799985,sha256:'3ca2d8afaa7f1cf7f6ed10e511ebc368bfacd6dcaa3dbfa690b89e502e8963dc'},
            {archive:'ffmpeg-8.1.2.tar.xz.asc',url:'https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz.asc',bytes:520,sha256:'0a0963fccd70597838073f3e31b20f4a4d8cc2b5e577472c9a5a1f22624246f8'},
            {archive:'ffmpeg-devel.asc',url:'https://ffmpeg.org/ffmpeg-devel.asc',bytes:1709,sha256:'397b3becedcd5a98769967ff1ff8501ddc89f8368b8f766e4701377d7dbaabe5'}];
          const began=performance.now();
          for(const row of rows){
            if(performance.now()-began>=180000)throw new Error('固定Native输入整体期限已到。');
            const file=path.join(root,row.archive);let bytes;
            if(existsSync(file))bytes=readV39Integration002Whole(file);
            else{
              const response=await fetch(row.url,{signal:AbortSignal.timeout(30000)});if(!response.ok)throw new Error('官方固定输入请求失败。');
              const reader=response.body.getReader(),chunks=[];let length=0;
              try{while(true){const part=await reader.read();if(part.done)break;length+=part.value.length;
                if(length>row.bytes)throw new Error('固定输入长度超过原记录。');chunks.push(Buffer.from(part.value));}}
              finally{await reader.cancel();}
              bytes=Buffer.concat(chunks,length);
              if(bytes.length!==row.bytes||createHash('sha256').update(bytes).digest('hex')!==row.sha256)throw new Error('固定输入全SHA/长度不符。');
              writeFileSync(file,bytes,{flag:'wx',mode:0o600});
            }
            if(bytes.length!==row.bytes||createHash('sha256').update(bytes).digest('hex')!==row.sha256)throw new Error('已有固定输入不符。');
          }
          NODE
          mkdir -m 700 "$RUNNER_TEMP/musicbridge-native-inputs/pgp"
          gpg --homedir "$RUNNER_TEMP/musicbridge-native-inputs/pgp" --batch --no-autostart --import "$RUNNER_TEMP/musicbridge-native-inputs/ffmpeg-devel.asc" > "$RUNNER_TEMP/musicbridge-native-inputs/pgp-import.log" 2>&1
          gpg --homedir "$RUNNER_TEMP/musicbridge-native-inputs/pgp" --batch --no-autostart --status-fd 1 --verify "$RUNNER_TEMP/musicbridge-native-inputs/ffmpeg-8.1.2.tar.xz.asc" "$RUNNER_TEMP/musicbridge-native-inputs/ffmpeg-8.1.2.tar.xz" > "$RUNNER_TEMP/musicbridge-native-inputs/pgp-verify.log" 2>&1
          grep -F '[GNUPG:] VALIDSIG FCF986EA15E6E293A5644F10B4322F04D67658D8 ' "$RUNNER_TEMP/musicbridge-native-inputs/pgp-verify.log"

      - name: 构建V3.9 独立CUE与保护标签bundle
        if: steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'source'
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}/packages/bridge-core
        run: |
          set -euo pipefail
          node --import tsx/esm ../../scripts/native/build-cue-ffmpeg.mjs "$RUNNER_TEMP/musicbridge-native-inputs/ffmpeg-8.1.2.tar.xz" "$RUNNER_TEMP/musicbridge-native-inputs/libogg-1.3.6.tar.xz" "$RUNNER_TEMP/musicbridge-native-inputs/libvorbis-1.3.7.tar.xz" "$RUNNER_TEMP/musicbridge-native-inputs/opus-1.6.1.tar.gz" "$RUNNER_TEMP/musicbridge-native-inputs/lame-4.0.tar.gz" "$RUNNER_TEMP/musicbridge-v39-002-cue-bundle" "$RUNNER_TEMP/musicbridge-v39-002-cue-build"
          node --import tsx/esm ../../scripts/native/build-local-audio-tags.mjs "$RUNNER_TEMP/musicbridge-native-inputs/taglib-2.3.2.tar.gz" "$RUNNER_TEMP/musicbridge-v39-002-tags-bundle" "$RUNNER_TEMP/musicbridge-v39-002-tags-build"

      - name: V3.9 八格式原生能力 Gate
        if: steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'source'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/verify-v39-integration-002-native.mjs --output-root "$RUNNER_TEMP/musicbridge-v39-002-native" --cue-bundle "$RUNNER_TEMP/musicbridge-v39-002-cue-bundle" --tags-bundle "$RUNNER_TEMP/musicbridge-v39-002-tags-bundle"

      - name: 封存本次Native原Core与Contracts完整编译图
        if: steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'source'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          node --input-type=module <<'NODE'
          import { snapshotV39Integration002NativeCompiledGraph } from './scripts/ci/prepare-v39-integration-002-artifacts.mjs';
          await snapshotV39Integration002NativeCompiledGraph({nativeRoot:process.env.RUNNER_TEMP+'/musicbridge-v39-002-native',outputRoot:process.env.RUNNER_TEMP+'/musicbridge-v39-002-native-compiled-snapshot'});
          NODE

      - name: Prepare Rust toolchain
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Build and verify both Rust hosts once in this job
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/prepare-rust-electron-hosts.mjs
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'

      - name: Install Electron binary from locked tree (official installer only)
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        run: |
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "官方Electron安装器第${attempt}次未完成，15秒后进行下一次有限尝试。"
              sleep 15
            fi
          done
          echo "官方Electron安装器三次均未完成，停止并保留失败记录。" >&2
          exit 1
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}/apps/desktop

      - name: Verify official Electron archive and actual execution tree
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node apps/desktop/scripts/prepare-electron-identity.mjs

      - name: Electron startup, crash/restart, safeStorage vault and credential recovery gates
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -o pipefail
          export MUSIC_BRIDGE_RUST_ELECTRON_REPORT="$MUSIC_BRIDGE_RUST_MAIN_HOST_BUILD_ROOT/electron-report.json"
          export MUSIC_BRIDGE_RUST_COLLECTION_ELECTRON_REPORT="$MUSIC_BRIDGE_RUST_COLLECTION_HOST_BUILD_ROOT/electron-report.json"
          corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:electron 2>&1 | tee "$RUNNER_TEMP/musicbridge-electron/electron-gates.log"

      - name: Electron end-to-end flow (Playwright, production build)
        if: steps.ci-metadata.outputs.repairMode != 'reuse-s165' && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -o pipefail
          corepack pnpm@10.17.1 --filter @music-bridge/desktop run test:e2e 2>&1 | tee "$RUNNER_TEMP/musicbridge-electron/electron-e2e.log"

      # 仅从本次成功移交收据选择已声明产物；不扫描宿主根或依赖链接。
      - name: Select declared synthetic Rust Host artifacts
        id: rust-host-artifacts
        if: ${{ steps.ci-metadata.outputs.repairMode != 'reuse-s165' && always() && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only' && env.MUSIC_BRIDGE_RUST_HOSTS_RECEIPT != '' }}
        shell: bash
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, realpathSync, appendFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { randomUUID } from 'node:crypto';
          import { readRustElectronHostsReceipt } from './scripts/ci/rust-electron-host-receipt.mjs';
          try {
            const receiptPath = process.env.MUSIC_BRIDGE_RUST_HOSTS_RECEIPT;
            const receipt = readRustElectronHostsReceipt(receiptPath, realpathSync('.'));
            const files = [receiptPath, receipt.manifestPath];
            for (const root of [receipt.mainHostBuildRoot, receipt.collectionHostBuildRoot]) {
              const manifestPath = path.join(root, 'artifact-manifest.json');
              const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
              files.push(manifestPath, ...manifest.artifacts.map(item => path.join(root, item.path)));
            }
            const unique = [...new Set(files)];
            for (const file of unique) {
              // upload-artifact 会解释通配符；拒绝它们以保持逐文件声明闭集。
              if ([...'*?[]{}!\r\n\0'].some(char => file.includes(char))) throw new Error('不规范路径');
            }
            const delimiter = 'MB_HOST_ARTIFACTS_' + randomUUID().replaceAll('-', '');
            appendFileSync(process.env.GITHUB_OUTPUT, `paths<<${delimiter}\n${unique.join('\n')}\n${delimiter}\n`);
            if ('${{ steps.v39-complete.outputs.integrationMode }}' === 'qualified') {
              const rows = unique.map((file, index) => ({ path: file, relative: 'entry-' + String(index).padStart(4, '0') + '/' + path.basename(file) }));
              writeFileSync(path.join(process.env.RUNNER_TEMP, 'musicbridge-electron', 'declared-host-files.json'), JSON.stringify(rows) + '\n', { flag: 'wx', mode: 0o600 });
            }
            console.log(`已选择 ${unique.length} 个本轮声明文件。`);
          } catch {
            console.error('本轮合成宿主产物闭集未确认，拒绝上传编译产物。');
            process.exitCode = 1;
          }
          NODE

      - name: 选择V3.9 当前Host声明原件
        if: always() && steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'source' && steps.rust-host-artifacts.outcome == 'success'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/prepare-v39-integration-002-artifacts.mjs --profile rust-host-source --output-root "$RUNNER_TEMP/musicbridge-v39-002-host-artifact" --declared-files "$RUNNER_TEMP/musicbridge-electron/declared-host-files.json"

      - name: Preserve declared synthetic Rust Host compiled artifacts
        if: ${{ steps.v39-complete.outputs.integrationMode != 'qualified' && steps.ci-metadata.outputs.repairMode != 'reuse-s165' && always() && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only' && steps.rust-host-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-host-compiled-${{ github.sha }}
          path: ${{ steps.rust-host-artifacts.outputs.paths }}
          # 只对逐文件声明的专属artifact启用，避免扩大原logs/cache上传范围。
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve declared synthetic Rust Host compiled artifacts
        if: always() && steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'source' && steps.rust-host-artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rust-host-compiled-${{ github.sha }}
          path: ${{ runner.temp }}/musicbridge-v39-002-host-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: 选择V3.9 Native与Electron声明原件
        if: always() && steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'source'
        working-directory: ${{ env.MUSIC_BRIDGE_BUILD_WORKSPACE }}
        run: node scripts/ci/prepare-v39-integration-002-artifacts.mjs --profile electron-source --output-root "$RUNNER_TEMP/musicbridge-v39-002-electron-artifact" --native-root "$RUNNER_TEMP/musicbridge-v39-002-native" --electron-root "$RUNNER_TEMP/musicbridge-electron" --compiled-root "$MUSIC_BRIDGE_BUILD_WORKSPACE/apps/desktop/out" --core-compiled-root "$RUNNER_TEMP/musicbridge-v39-002-native-compiled-snapshot"

      - name: 保留本次V3.9 完整集成证据
        if: always() && steps.v39-complete.outputs.integrationMode == 'qualified' && steps.v39-complete.outputs.integrationRole == 'source'
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/musicbridge-v39-002-electron-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Electron logs and synthetic test artifacts
        if: steps.v39-complete.outputs.integrationMode != 'qualified' && steps.ci-metadata.outputs.repairMode != 'reuse-s165' && always() && steps.ci-repair.outputs.repairMode != 'reuse-s165' && steps.ci-mode.outputs.mode != 'report-only'
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/musicbridge-electron/
            !${{ runner.temp }}/musicbridge-electron/workspace/**
            ${{ runner.temp }}/musicbridge-rust-core/**/*.json
            ${{ runner.temp }}/musicbridge-rust-core/**/*.log
          if-no-files-found: warn
          retention-days: 14
