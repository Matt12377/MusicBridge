<body>
<div class="app" id="app">
  <aside class="sidebar" aria-label="主导航">
    <div class="brand"><i class="bi bi-soundwave" aria-hidden="true"></i><span class="brand-name">Music Bridge<small>FOR ROON</small></span><button id="collapse" aria-label="收起侧栏"><i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i></button></div>
    <button class="side-search" id="search-focus"><i class="bi bi-search" aria-hidden="true"></i>搜索歌曲或歌手<kbd>⌘ K</kbd></button>
    <nav class="nav-scroll" id="nav"></nav>
    <button class="account" id="account"><img class="avatar" src="assets/cover-1.jpg" alt="演示账户头像"><span><strong>音乐收藏家</strong><small>网易云账户 · 演示</small></span><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
  </aside>
  <section class="workspace">
    <header class="topbar"><div class="breadcrumb"><span>音乐资料库</span><i class="bi bi-chevron-right" aria-hidden="true"></i><strong id="breadcrumb">我喜欢的音乐</strong></div><div class="top-actions"><span class="preview-badge">SAKURA / 01 · 交互演示</span><button class="pill" id="pending"><i class="bi bi-inbox" aria-hidden="true"></i>未确认操作</button><button class="pill" id="connection"><span class="status-dot"></span>连接预览<i class="bi bi-chevron-down" aria-hidden="true"></i></button></div></header>
    <div class="body-area">
      <main class="content-scroll">
        <section class="hero"><div class="hero-art" aria-hidden="true"><img src="assets/cover-1.jpg" alt=""><img src="assets/cover-2.jpg" alt=""><img src="assets/cover-3.jpg" alt=""><img src="assets/cover-4.jpg" alt=""></div><div class="hero-copy"><p class="eyebrow" id="eyebrow">YOUR PERSONAL COLLECTION</p><h1 id="page-title">我喜欢的音乐</h1><p class="description" id="description">收藏每一次心动，让喜欢的旋律陪你久一点。</p><div class="hero-bottom"><button class="primary" id="play-all"><i class="bi bi-play-fill" aria-hidden="true"></i>播放全部</button><button class="secondary" id="add-all"><i class="bi bi-music-note-list" aria-hidden="true"></i>加入队列</button><button class="icon-btn" id="hero-more" aria-label="更多歌单操作"><i class="bi bi-three-dots" aria-hidden="true"></i></button><span class="hero-stat" id="hero-stat">12 首歌曲 · 约 48 分钟</span></div></div></section>
        <div id="songs-view"><section class="list-panel"><div class="list-toolbar"><label class="filter"><i class="bi bi-search" aria-hidden="true"></i><input id="search" type="search" placeholder="在喜欢的音乐中搜索" aria-label="搜索演示歌曲或歌手"></label><div class="sort"><select id="sort" aria-label="歌曲排序"><option value="default">默认排序</option><option value="name">歌曲名称</option><option value="duration">歌曲时长</option></select><i class="bi bi-list" aria-hidden="true"></i></div></div><div class="thead" aria-hidden="true"><span>#</span><span>歌曲 / 歌手</span><span class="album-name">专辑</span><span>时长</span><span></span></div><div id="tracks"></div></section><div class="list-foot"><span id="results">已显示 12 首歌曲</span><span>演示曲目与示意封面 · 不播放真实音频</span></div></div>
        <div id="cards-view" class="card-grid" hidden></div>
      </main>
      <aside class="queue" id="queue" hidden aria-label="播放队列"><div class="queue-head"><h2>播放队列</h2><button class="icon-btn" id="close-queue" aria-label="关闭播放队列"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div><div class="queue-meta"><span>正在播放 · 模拟</span><span id="queue-count">12 首</span></div><div class="queue-current" id="queue-current"></div><div class="queue-meta"><span>接下来</span><span>顺序播放</span></div><div class="queue-list" id="queue-list"></div><p class="queue-caption">队列仅保存在本次预览中</p></aside>
    </div>
  </section>
  <footer class="player" aria-label="全局播放器预览">
    <div class="now-track"><img id="now-art" src="assets/cover-1.jpg" alt="示意封面"><div class="now-copy"><strong id="now-title">樱花落下的时候</strong><small id="now-artist">春日来信 · 音乐预览</small><div class="tags"><span class="tag blue">FLAC</span><span class="tag">LOSSLESS · 演示</span></div></div><button class="icon-btn heart liked" id="now-like" aria-label="取消喜欢当前歌曲" aria-pressed="true"><i class="bi bi-heart-fill" aria-hidden="true"></i></button></div>
    <div class="player-center"><div class="transport"><button class="icon-btn" id="shuffle" aria-label="随机播放" aria-pressed="false"><i class="bi bi-shuffle" aria-hidden="true"></i></button><button class="icon-btn" id="previous" aria-label="上一首"><i class="bi bi-skip-start-fill" aria-hidden="true"></i></button><button class="big-play" id="toggle-play" aria-label="开始模拟播放"><i class="bi bi-play-fill" aria-hidden="true"></i></button><button class="icon-btn" id="next" aria-label="下一首"><i class="bi bi-skip-end-fill" aria-hidden="true"></i></button><button class="icon-btn" id="repeat" aria-label="循环播放" aria-pressed="false"><i class="bi bi-repeat" aria-hidden="true"></i></button></div><div class="timeline"><span id="elapsed">1:06</span><input id="seek" type="range" min="0" max="244" value="66" aria-label="模拟播放进度"><span id="total">4:04</span></div></div>
    <div class="player-right"><label class="quality"><small>下次音质</small><select id="quality" aria-label="下次播放音质"><option>自动</option><option>标准</option><option>高品质</option><option>无损</option><option>Hi-Res</option></select></label><button class="device" id="device"><i class="bi bi-speaker" aria-hidden="true"></i><span><strong>Studio Display</strong><small>播放设备 · 演示</small></span><i class="bi bi-chevron-down" aria-hidden="true"></i></button><button class="icon-btn queue-toggle" id="queue-toggle" aria-label="打开播放队列" aria-expanded="false"><i class="bi bi-list-ul" aria-hidden="true"></i></button></div>
  </footer>
</div>
<dialog id="dialog"><button class="icon-btn close-dialog" id="close-dialog" aria-label="关闭弹窗"><i class="bi bi-x-lg" aria-hidden="true"></i></button><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog>
<div class="toast" role="status" id="toast" hidden></div>
<script>
  // 此预览不接入 MusicBridge IPC、真实账号、音频或用户数据库。
  const songs=[
    ['樱花落下的时候','春日来信','春日来信',244,1],['海风经过','Sunday Morning','Blue Hour',232,2],['森林里的慢镜头','青木与风','走进四月',268,3],['月光写给你的诗','Mellow Days','After Midnight',215,4],['遥远的山','山间电台','等风来',251,5],['在绿意里醒来','青木与风','Forest Notes',237,6],['粉色的星期天','春日来信','春日来信',223,1],['慢慢靠近你','Sunday Morning','Blue Hour',259,2],['一千次日落','Mellow Days','After Midnight',287,4],['直到春天结束','山间电台','等风来',238,3],['把时间留给海','Sunday Morning','Blue Hour',264,2],['晚安，亲爱的世界','青木与风','Forest Notes',241,6]
  ].map((s,id)=>({id,title:s[0],artist:s[1],album:s[2],duration:s[3],cover:s[4],liked:true}));
  const groups=[['发现',[['主页','house-door']]],['资料库',[['我喜欢的音乐','heart'],['所有歌单','grid']]],['本地音乐库',[['专辑','vinyl'],['艺术家','people'],['流派','collection'],['Roon 歌单','music-note-list'],['Roon 收藏','bookmark-heart']]],['我的实物与录音',[['收藏','cassette'],['录音','record-circle']]],['歌单',[['春日来信','image',1],['一些温柔的夜晚','image',4],['把时间留给海','image',2]]]];
  const $=id=>document.getElementById(id),icon=name=>`<i class="bi bi-${name}" aria-hidden="true"></i>`,art=s=>`assets/cover-${s.cover}.jpg`,fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
  let current=0,playing=false,position=66,queue=songs.map(s=>s.id),random=false,repeat=false,page='我喜欢的音乐',toastTimer;
  $('nav').innerHTML=groups.map(([label,items])=>`<div class="nav-group"><p class="nav-label">${label}</p>${items.map(([name,i,cover])=>`<button class="nav-item ${cover?'playlist-item':''} ${name===page?'active':''}" data-page="${name}" ${name===page?'aria-current="page"':''} title="${name}">${cover?`<img class="tiny-cover" src="assets/cover-${cover}.jpg" alt="">`:icon(i)}<span>${name}</span>${name==='我喜欢的音乐'?'<span class="count">12</span>':''}</button>`).join('')}</div>`).join('');
  function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2800)}
  function visibleSongs(){let list=songs.filter(s=>`${s.title} ${s.artist} ${s.album}`.toLowerCase().includes($('search').value.trim().toLowerCase()));if($('sort').value==='name')list.sort((a,b)=>a.title.localeCompare(b.title,'zh'));if($('sort').value==='duration')list.sort((a,b)=>a.duration-b.duration);return list}
  function renderTracks(){const list=visibleSongs();$('tracks').innerHTML=list.length?list.map(s=>`<div class="track ${s.id===current?'current':''}"><span class="num">${s.id===current?icon(playing?'soundwave':'play-fill'):String(s.id+1).padStart(2,'0')}</span><button class="track-main" data-play="${s.id}" aria-label="模拟播放 ${s.title}"><img src="${art(s)}" alt="${s.title} 示意封面"><span class="track-name"><strong>${s.title}</strong><small>${s.artist}</small></span></button><span class="album-name">${s.album}</span><span class="duration">${fmt(s.duration)}</span><div class="track-actions"><button class="icon-btn mini heart ${s.liked?'liked':''}" data-like="${s.id}" aria-label="${s.liked?'取消喜欢':'喜欢'} ${s.title}" aria-pressed="${s.liked}">${icon(s.liked?'heart-fill':'heart')}</button><button class="icon-btn mini more" data-more="${s.id}" aria-label="${s.title} 更多操作">${icon('three-dots')}</button></div></div>`).join(''):'<p class="empty">没有找到匹配的歌曲<br>试试搜索「海风」或「春日」。</p>';$('results').textContent=`已显示 ${list.length} / ${songs.length} 首歌曲`}
  function renderQueue(){const s=songs[current];$('queue-count').textContent=`${queue.length} 首`;$('queue-current').innerHTML=`<img src="${art(s)}" alt="示意封面"><div><small>${playing?'正在播放':'已暂停'} · 演示</small><strong>${s.title}</strong><small>${s.artist}</small></div>`;const idx=queue.indexOf(current);const next=idx>=0?queue.slice(idx+1):queue;$('queue-list').innerHTML=next.length?next.map(id=>{const t=songs[id];return `<button class="queue-row" data-play="${id}" aria-label="队列播放 ${t.title}"><img src="${art(t)}" alt=""><span><strong>${t.title}</strong><small>${t.artist}</small></span><small>${fmt(t.duration)}</small></button>`}).join(''):'<p class="empty">已经是队列最后一首</p>'}
  function updatePlayer(){const s=songs[current];$('now-art').src=art(s);$('now-title').textContent=s.title;$('now-artist').textContent=`${s.artist} · 音乐预览`;$('toggle-play').innerHTML=icon(playing?'pause-fill':'play-fill');$('toggle-play').setAttribute('aria-label',playing?'暂停模拟播放':'开始模拟播放');$('now-like').innerHTML=icon(s.liked?'heart-fill':'heart');$('now-like').classList.toggle('liked',s.liked);$('now-like').setAttribute('aria-pressed',s.liked);$('now-like').setAttribute('aria-label',s.liked?'取消喜欢当前歌曲':'喜欢当前歌曲');$('seek').max=s.duration;$('seek').value=position;$('seek').style.setProperty('--progress',`${position/s.duration*100}%`);$('elapsed').textContent=fmt(position);$('total').textContent=fmt(s.duration)}
  function play(id){current=id;position=0;playing=true;if(!queue.includes(id))queue.push(id);updatePlayer();renderTracks();renderQueue()}
  function step(dir){let idx=queue.indexOf(current);const next=random&&dir>0?queue[Math.floor(Math.random()*queue.length)]:queue[idx+dir];if(next!==undefined)play(next);else if(repeat&&queue.length)play(dir>0?queue[0]:queue.at(-1));else{playing=false;updatePlayer();renderTracks();renderQueue();toast(dir>0?'已到队列末尾':'已经是第一首')}}
  function setQueue(open){$('queue').hidden=!open;$('queue-toggle').setAttribute('aria-expanded',open);$('queue-toggle').setAttribute('aria-label',open?'关闭播放队列':'打开播放队列');if(open)renderQueue()}
  function modal(title,body){$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog').showModal()}
  function navigate(name){page=name;$('page-title').textContent=name;$('breadcrumb').textContent=name;document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===name);if(b.dataset.page===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const cards=['所有歌单','专辑','艺术家','流派','收藏','录音'].includes(name);$('songs-view').hidden=cards;$('cards-view').hidden=!cards;$('cards-view').style.display=cards?'grid':'none';$('description').textContent=name==='我喜欢的音乐'?'收藏每一次心动，让喜欢的旋律陪你久一点。':'同一片樱花光影，收藏不同的音乐时刻。';$('search').value='';if(cards){const names=name==='流派'?['轻音乐','独立流行','氛围音乐','爵士','古典','民谣']:name==='艺术家'?songs.slice(0,6).map(s=>s.artist):songs.slice(0,6).map(s=>s.album);$('cards-view').innerHTML=name==='收藏'||name==='录音'?`<section class="glass empty" style="grid-column:1/-1;border-radius:22px;padding:55px 24px"><h2>${name==='收藏'?'我的实物收藏':'录音工作区'}</h2><p style="margin-top:15px">此页仅展示玻璃面板材质，不加载个人${name==='收藏'?'库存与照片':'录音数据'}。</p><p>正式应用中的功能与资料保持不变。</p><button class="secondary" data-back style="margin-top:20px">返回音乐预览</button></section>`:names.map((n,i)=>`<button class="album-card" data-card="${n}"><img src="assets/cover-${i+1}.jpg" alt="${n} 示意照片"><strong>${n}</strong><small>${name==='艺术家'?'艺术家':'精选音乐'} · 演示</small></button>`).join('')}$('hero-stat').textContent=cards?'仅展示示意数据':'12 首歌曲 · 约 48 分钟';renderTracks()}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.play!==undefined)play(Number(b.dataset.play));if(b.dataset.like!==undefined){const s=songs[Number(b.dataset.like)];s.liked=!s.liked;renderTracks();updatePlayer()}if(b.dataset.more!==undefined){const s=songs[Number(b.dataset.more)];modal(s.title,`<p>预览操作，不修改真实歌单。</p><button class="setting-row" style="width:100%" data-next="${s.id}">下一首播放 ${icon('skip-end')}</button><button class="setting-row" style="width:100%" data-append="${s.id}">加入队列 ${icon('music-note-list')}</button>`)}if(b.dataset.next!==undefined){queue=queue.filter(id=>id!==Number(b.dataset.next));queue.splice(queue.indexOf(current)+1,0,Number(b.dataset.next));$('dialog').close();renderQueue();toast('已设为下一首 · 演示')}if(b.dataset.append!==undefined){if(!queue.includes(Number(b.dataset.append)))queue.push(Number(b.dataset.append));$('dialog').close();renderQueue();toast('已加入演示队列')}if(b.dataset.card)navigate(b.dataset.card);if(b.hasAttribute('data-back'))navigate('我喜欢的音乐')});
  $('search').addEventListener('input',renderTracks);$('sort').addEventListener('change',renderTracks);$('toggle-play').onclick=()=>{playing=!playing;updatePlayer();renderTracks();renderQueue()};$('next').onclick=()=>step(1);$('previous').onclick=()=>step(-1);$('seek').oninput=e=>{position=Number(e.target.value);updatePlayer()};$('now-like').onclick=()=>{songs[current].liked=!songs[current].liked;renderTracks();updatePlayer()};$('queue-toggle').onclick=()=>setQueue($('queue').hidden);$('close-queue').onclick=()=>setQueue(false);$('play-all').onclick=()=>{queue=visibleSongs().map(s=>s.id);if(queue.length)play(queue[0]);else toast('没有可播放的演示歌曲')};$('add-all').onclick=()=>{queue=[...new Set([...queue,...visibleSongs().map(s=>s.id)])];setQueue(true);toast('已加入演示队列')};$('shuffle').onclick=()=>{random=!random;$('shuffle').classList.toggle('active',random);$('shuffle').setAttribute('aria-pressed',random);toast(random?'随机播放已开启 · 演示':'已恢复顺序播放')};$('repeat').onclick=()=>{repeat=!repeat;$('repeat').classList.toggle('active',repeat);$('repeat').setAttribute('aria-pressed',repeat);toast(repeat?'队列循环已开启':'队列循环已关闭')};$('quality').onchange=()=>toast('音质选择仅用于界面预览');$('close-dialog').onclick=()=>$('dialog').close();$('dialog').onclick=e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close()}};
  $('connection').onclick=()=>modal('连接状态', '<p>这是独立 HTML 设计预览，没有连接真实服务。</p><div class="setting-row"><span>Music Bridge Core</span><small>未连接 · 预览</small></div><div class="setting-row"><span>Roon / 网易云</span><small>未连接 · 预览</small></div><div class="setting-row"><span>当前设备</span><small>Studio Display（示意）</small></div>');
  $('pending').onclick=()=>modal('未确认操作','<p>预览没有待确认的写入操作，也不会更改个人库存、歌单或账号。</p>');
  $('device').onclick=()=>modal('播放设备','<p>以下设备仅用于展示选择样式，不会向真实设备发送声音。</p><label class="setting-row"><span>Studio Display</span><input type="radio" name="device" checked aria-label="选择示意设备 Studio Display"></label>');
  $('account').onclick=()=>modal('账户与外观','<p>演示账户 · 所有设置仅在本次预览中生效。</p><div class="setting-row"><span>视觉主题</span><strong>樱花玻璃</strong></div><label class="setting-row"><span>增强面板可读性</span><input id="contrast" type="checkbox" aria-label="增强面板可读性" onchange="document.documentElement.style.setProperty(\'--glass\',this.checked?\'rgba(255,255,255,.82)\':\'rgba(255,255,255,.46)\');document.querySelector(\'.list-panel\').style.background=this.checked?\'rgba(255,255,255,.9)\':\'rgba(255,255,255,.58)\'"></label>');
  $('hero-more').onclick=()=>modal('歌单操作','<p>正式应用的更多操作入口保持不变。此版先确认颜色、层次、列表与播放器效果。</p>');
  $('collapse').onclick=()=>$('app').classList.toggle('collapsed');document.querySelector('.brand').addEventListener('click',e=>{if($('app').classList.contains('collapsed')&&!e.target.closest('button'))$('app').classList.remove('collapsed')});
  $('search-focus').onclick=()=>{navigate('我喜欢的音乐');$('search').focus()};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('search-focus').click()}if(e.key==='Escape')setQueue(false)});
  setInterval(()=>{if(!playing)return;position++;if(position>=songs[current].duration)step(1);else updatePlayer()},1000);
  renderTracks();updatePlayer();renderQueue();
</script>
</body>
</html>
