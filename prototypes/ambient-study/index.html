<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#302c35;background:#f2edf1;font-size:14px;--accent:#a84c72;--secondary:#635c69;--line:#67546b20}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:hover{background:#ffffff70}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:default}button,select{border-radius:10px}h1,h2,p{margin:0}i{font-style:normal}img{display:block;object-fit:cover}[hidden]{display:none!important}.study-bar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px;background:#f8f6f9;border-bottom:1px solid var(--line);position:relative;z-index:50}.study-title{font-size:12px;color:var(--secondary)}.study-title strong{color:#352f3b;margin-right:12px}.study-actions{display:flex;align-items:center;gap:14px}.switch{display:flex;padding:3px;background:#e8e3eb;border-radius:10px}.switch button{font-size:12px;padding:7px 13px}.switch button[aria-pressed=true]{background:#fff;box-shadow:0 2px 6px #40304a12}.text-button{font-size:12px;color:var(--secondary);padding:7px 8px}.app{height:calc(100dvh - 54px);min-height:530px;position:relative;isolation:isolate;overflow:hidden;background:#ebe5ed}.wallpaper{position:absolute;inset:0;z-index:-3;overflow:hidden}.wallpaper img{position:absolute;width:100%;height:100%;object-fit:cover;transform:scale(1.05);opacity:0;transition:opacity 900ms ease;filter:blur(3px) saturate(.84)}.wallpaper img.visible{opacity:1}.wallpaper img.album{filter:blur(24px) saturate(.8);transform:scale(1.14)}.wash{position:absolute;inset:0;z-index:-2;background:rgba(246,241,245,.30);transition:background 700ms}.app.has-track .wash{background:rgba(246,241,245,.60)}.layout{height:100%;display:flex;transition:opacity .25s}.sidebar{flex:0 0 224px;padding:25px 14px 18px;display:flex;flex-direction:column;min-height:0;background:rgba(248,245,249,.30);backdrop-filter:blur(25px) saturate(1.08);border-right:1px solid #ffffff65}.brand{font-weight:750;font-size:18px;letter-spacing:-.7px;padding:0 12px 24px;display:flex;justify-content:space-between;align-items:center}.brand small{font-size:10px;color:var(--accent);font-weight:500;letter-spacing:1px}.search{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#ffffff68;border:1px solid #ffffff70;border-radius:10px}.search input{width:100%;min-width:0;border:0;outline:none;background:none;font-size:12px}.nav-scroll{overflow:auto;min-height:0;flex:1;scrollbar-width:thin;padding-bottom:18px}.nav-heading{font-size:11px;color:var(--secondary);margin:25px 12px 9px;font-weight:600}.nav-item{display:flex;width:100%;align-items:center;gap:12px;min-height:38px;padding:8px 12px;text-align:left;font-size:13px;margin:2px 0}.nav-item .bi{font-size:16px}.nav-item.active{color:#843759;background:#c782a228;font-weight:600}.nav-item img{width:26px;height:26px;border-radius:6px}.fold{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:22px;padding:9px 12px;font-size:11px}.settings{flex-shrink:0;padding:12px;background:#ffffff50;border:1px solid #ffffff75;display:flex;gap:12px;align-items:center;width:100%;text-align:left}.settings .bi:last-child{margin-left:auto}.main{flex:1;min-width:0;overflow:auto;padding:35px 44px 140px;background:#f8f5f815;scrollbar-width:thin;scrollbar-color:#94778866 transparent}.content{max-width:1380px;margin:0 auto}.welcome{margin-bottom:32px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--secondary);margin-bottom:9px}.welcome h1{font-size:33px;letter-spacing:-1.1px;font-weight:650}.welcome p:last-child{font-size:13px;color:var(--secondary);margin-top:10px}.state-note{font-size:11px;color:var(--secondary);text-align:right;line-height:1.8}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}.section-head h2{font-size:22px;font-weight:650;letter-spacing:-.5px}.section-head p{font-size:12px;color:var(--secondary);margin-top:6px}.section-actions{display:flex;gap:10px;align-items:center}.primary{background:var(--accent);color:white;border-radius:20px;padding:9px 15px;font-size:12px}.primary:hover{background:#913e61}.cover-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:23px}.cover-card{padding:0;text-align:left;min-width:0;border-radius:0;background:none!important}.cover-wrap{position:relative;display:block;overflow:hidden;border-radius:12px;box-shadow:0 7px 19px #35253c16}.cover-wrap img{width:100%;aspect-ratio:1;transition:transform .3s}.cover-card:hover img{transform:scale(1.025)}.cover-play{position:absolute;right:12px;bottom:12px;display:grid;place-items:center;width:36px;height:36px;background:#ffffffca;backdrop-filter:blur(10px);border-radius:50%;opacity:0;transition:opacity .15s}.cover-card:hover .cover-play,.cover-card:focus-visible .cover-play,.cover-card.current .cover-play{opacity:1}.cover-card.current .cover-play{background:var(--accent);color:white}.cover-card strong{display:block;margin-top:12px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cover-card small{display:block;margin-top:5px;font-size:12px;color:var(--secondary)}.section{margin-bottom:38px}.section-bottom{font-size:11px;color:var(--secondary);margin-top:18px}.player{position:absolute;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);width:min(1060px,calc(100% - 64px));height:88px;display:grid;grid-template-columns:minmax(0,1fr) 205px minmax(0,1fr);align-items:center;padding:14px 20px;gap:18px;background:rgba(247,242,247,.70);backdrop-filter:blur(32px) saturate(.90);border:1px solid #ffffffaa;border-radius:23px;box-shadow:0 14px 42px #33243922,inset 0 1px #ffffff80}.player-track{display:flex;align-items:center;gap:12px;min-width:0}.player-art{width:53px;height:53px;flex-shrink:0;border-radius:10px;background:#ffffff45;display:grid;place-items:center;color:#9c758d;font-size:22px;overflow:hidden}.player-art img{width:100%;height:100%}.player-copy{min-width:0}.player-copy strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-copy small{font-size:11px;color:var(--secondary);display:block;margin-top:5px}.transport{display:flex;align-items:center;justify-content:center;gap:14px}.icon-button{width:30px;height:30px;display:grid;place-items:center}.play-button{width:45px;height:45px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:white;font-size:22px}.play-button:hover{background:#913e61}.player-controls{display:flex;align-items:center;justify-content:flex-end;gap:8px}.control{background:#ffffff38;padding:8px 10px;border:1px solid #ffffff55;font-size:11px;display:flex;align-items:center;gap:7px}.quality{display:block}.quality label{font-size:9px;display:block;color:var(--secondary)}select{max-width:82px;font-size:11px;background:transparent;border:0}.control.device{max-width:150px}.queue{position:absolute;right:20px;bottom:120px;width:285px;padding:18px;background:#f8f4f9eb;backdrop-filter:blur(25px);border:1px solid #fff9;border-radius:18px;box-shadow:0 10px 40px #35253b20;z-index:15}.queue h2{font-size:17px;margin-bottom:12px}.queue button{width:100%;display:flex;gap:10px;padding:9px;text-align:left;align-items:center;font-size:12px}.queue img{width:35px;height:35px;border-radius:7px}.queue small{display:block;margin-top:3px;color:var(--secondary)}.track-list{background:#fff9;border:1px solid #ffffff90;border-radius:18px;padding:12px 18px}.track-row{display:flex;width:100%;gap:14px;align-items:center;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);border-radius:0}.track-row:last-child{border:0}.track-row img{width:48px;height:48px;border-radius:8px}.track-row strong{display:block;font-size:14px}.track-row small{display:block;font-size:12px;color:var(--secondary);margin-top:5px}.track-row time{margin-left:auto;color:var(--secondary);font-size:12px}.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:20;background:#fcf9fdef;box-shadow:0 6px 22px #47344915;border-radius:15px;padding:12px 18px;font-size:12px}.only-background .layout,.only-background .player{opacity:0;pointer-events:none}.only-background .wash{background:rgba(246,241,245,.14)}dialog{max-width:440px;width:calc(100% - 40px);padding:26px;border:1px solid #fff;border-radius:22px;background:#f8f5f9f5;box-shadow:0 20px 80px #463b4933}dialog::backdrop{background:#40354b30;backdrop-filter:blur(8px)}dialog h2{font-size:21px;margin-bottom:14px}dialog p{font-size:13px;line-height:1.9;color:var(--secondary);margin-bottom:18px}.close{float:right}.empty{padding:35px;font-size:14px;color:var(--secondary)}
@media(max-width:1150px){.sidebar{flex-basis:198px}.main{padding-inline:28px}.cover-grid{gap:16px}.player{grid-template-columns:minmax(0,1fr) 140px minmax(0,1fr);gap:8px;padding-inline:16px}.state-note{display:none}.device span{display:none}.nav-scroll{padding-bottom:110px}.study-title span{display:none}}
@media(max-width:800px){.sidebar{flex-basis:66px;padding-inline:8px}.brand{font-size:0;padding-inline:8px}.brand small{font-size:14px}.nav-item{justify-content:center;padding-inline:0}.nav-item span,.search,.nav-heading,.fold,.settings span,.settings .bi:last-child,#playlists{display:none}.nav-scroll{padding-top:10px}.settings{justify-content:center;padding:12px 0}.main{padding:25px 20px 155px}.cover-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.welcome h1{font-size:28px}.study-bar{padding-inline:12px}.study-actions{gap:6px}.switch button{padding-inline:9px}.player{width:calc(100% - 24px);bottom:12px;min-height:110px;grid-template-columns:minmax(0,1fr) 130px;height:auto;row-gap:9px}.player-controls{grid-column:1/-1}.section-head{align-items:flex-start}.section-head h2{font-size:19px}.section-actions{gap:2px}.section-actions .text-button{display:none}.cover-card strong{font-size:13px}.study-title{font-size:11px}.study-title strong{margin:0}.control{padding:5px 9px}.quality{display:flex;gap:9px}.welcome{margin-bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(prefers-reduced-transparency:reduce){.sidebar,.player,.queue,.track-list{background:#f5f0f7;backdrop-filter:none}.wash{background:#f5f0f7d9!important}}

<body>
<header class="study-bar"><div class="study-title"><strong>背景研究 / 01</strong><span>交互预览 · 示意曲目，不播放音频</span></div><div class="study-actions"><div class="switch" aria-label="预览状态"><button id="idle" aria-pressed="true">未播放</button><button id="demo" aria-pressed="false">播放中</button></div><button id="background-only" class="text-button" aria-pressed="false">查看背景</button></div></header>
<main class="app" id="app"><div class="wallpaper" aria-hidden="true"><img id="bg-a" class="visible" src="assets/default-scene.png" alt=""><img id="bg-b" alt=""></div><div class="wash"></div>
<div class="layout"><aside class="sidebar"><div class="brand">Music Bridge <small>MB</small></div><label class="search"><i class="bi bi-search" aria-hidden="true"></i><input id="search" aria-label="搜索示意歌曲" placeholder="搜索歌曲或歌手"></label><nav class="nav-scroll" aria-label="主导航"><div id="navigation"></div><button class="fold" id="fold" aria-expanded="true" aria-controls="playlists">网易云歌单 <i class="bi bi-chevron-down" aria-hidden="true"></i></button><div id="playlists"></div></nav><button class="settings" id="settings" aria-label="设置"><i class="bi bi-sliders" aria-hidden="true"></i><span>设置</span><i class="bi bi-chevron-right" aria-hidden="true"></i></button></aside>
<section class="main"><div class="content"><header class="welcome"><div><p class="eyebrow">MUSIC BRIDGE</p><h1 id="heading">下午好</h1><p id="lede">让音乐，为此刻添一点颜色。</p></div><div class="state-note" id="state-note" role="status">默认背景<br>选择一张封面，看看画面如何变化</div></header><div id="page"></div></div></section></div>
<footer class="player" aria-label="模拟播放器"><div class="player-track"><div class="player-art" id="player-art"><i class="bi bi-music-note-beamed" aria-hidden="true"></i></div><div class="player-copy"><strong id="track-title">选择内容开始播放</strong><small id="track-artist">Music Bridge</small></div></div><div class="transport"><button id="previous" class="icon-button" aria-label="上一首" disabled><i class="bi bi-skip-start-fill" aria-hidden="true"></i></button><button id="play" class="play-button" aria-label="模拟播放"><i class="bi bi-play-fill" aria-hidden="true"></i></button><button id="next" class="icon-button" aria-label="下一首" disabled><i class="bi bi-skip-end-fill" aria-hidden="true"></i></button></div><div class="player-controls"><div class="control quality"><label for="quality">下次音质</label><select id="quality"><option>自动</option><option>无损</option><option>高品质</option></select></div><button class="control device" id="device" aria-label="预览播放设备"><i class="bi bi-speaker" aria-hidden="true"></i><span>Studio Display</span><i class="bi bi-chevron-down" aria-hidden="true"></i></button><button class="control" id="queue-toggle" aria-label="打开示意队列" aria-expanded="false" aria-controls="queue"><i class="bi bi-list-ul" aria-hidden="true"></i></button></div></footer>
<aside id="queue" class="queue" hidden><h2>接下来播放</h2><div id="queue-items"></div></aside><div id="toast" class="toast" role="status" hidden></div></main>
<dialog id="dialog"><button class="text-button close" id="close">关闭</button><h2>外观与预览</h2><label class="theme-setting">主题 <select id="theme-select" aria-label="主题"><option value="light">浅色</option><option value="dark">深色</option></select></label><p>默认背景是一幅连续画面。选择歌曲后，整个窗口柔和切换到同一张示意封面；暂停保留背景，返回「未播放」恢复默认画面。</p><p>曲目、封面与设备均为演示内容。这里不连接账号、真实播放器或用户资料库。</p><button class="primary" id="try-blue">试试蓝色封面</button></dialog>
<script>
// 独立视觉预览：只维护本页模拟状态，不接入真实账号、音频或用户数据。
const $=id=>document.getElementById(id),icon=n=>`<i class="bi bi-${n}" aria-hidden="true"></i>`;
const songs=[['樱花落下的时候','春日来信',1],['海风经过','Sunday Morning',2],['森林里的慢镜头','青木与风',3],['月光写给你的诗','Mellow Days',4],['遥远的山','山间电台',5],['在绿意里醒来','青木与风',6]].map(([title,artist,cover],id)=>({id,title,artist,cover:`../sakura-glass/assets/cover-${cover}.jpg`}));
let current=-1,playing=false,page='主页',generation=0,activeBg='a',toastTimer;
const groups=[['资料库',[['主页','house-door'],['所有歌单','grid'],['专辑','vinyl'],['艺术家','people'],['流派','collection'],['Roon 歌单','music-note-list']]],['收藏',[['我喜欢的音乐','heart'],['Roon 收藏','bookmark-heart'],['实物收藏','cassette'],['录音','record-circle']]]];
$('navigation').innerHTML=groups.map(([name,items])=>`<p class="nav-heading">${name}</p>${items.map(([name,i])=>`<button class="nav-item ${name==='主页'?'active':''}" data-page="${name}" ${name==='主页'?'aria-current="page"':''} title="${name}">${icon(i)}<span>${name}</span></button>`).join('')}`).join('');
$('playlists').innerHTML=songs.slice(0,3).map(s=>`<button class="nav-item" data-play="${s.id}" title="${s.title}"><img src="${s.cover}" alt=""><span>${s.title}</span></button>`).join('');
$('queue-items').innerHTML=songs.map(s=>`<button data-play="${s.id}"><img src="${s.cover}" alt=""><span>${s.title}<small>${s.artist}</small></span></button>`).join('');
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function card(s){return `<button class="cover-card ${s.id===current?'current':''}" data-play="${s.id}" aria-label="模拟播放 ${s.title}"><span class="cover-wrap"><img src="${s.cover}" alt="${s.title} 示意封面"><span class="cover-play">${icon(s.id===current&&playing?'pause-fill':'play-fill')}</span></span><strong>${s.title}</strong><small>${s.artist}</small></button>`}
function render(){const query=$('search').value.trim().toLowerCase(),list=songs.filter(s=>(s.title+s.artist).toLowerCase().includes(query));$('heading').textContent=query?'搜索结果':page==='主页'?'下午好':page;$('lede').textContent=query?'搜索本页的示意曲目。':page==='主页'?'让音乐，为此刻添一点颜色。':'收藏喜欢的声音，随时回来聆听。';if(!list.length){$('page').innerHTML='<p class="empty">没有找到匹配的示意歌曲。</p>';return}if(page==='我喜欢的音乐'||query){$('page').innerHTML=`<div class="track-list">${list.map(s=>`<button class="track-row" data-play="${s.id}"><img src="${s.cover}" alt=""><span><strong>${s.title}</strong><small>${s.artist} · 示意曲目</small></span><time>3:48</time></button>`).join('')}</div>`;return}$('page').innerHTML=`<section class="section"><header class="section-head"><div><h2>每日推荐</h2><p>为今天挑选的一些温柔声音</p></div><div class="section-actions"><button class="text-button" data-list>查看全部 ${icon('arrow-right')}</button><button class="primary" data-play="0">${icon('play-fill')} 播放全部</button></div></header><div class="cover-grid">${list.slice(0,5).map(card).join('')}</div><p class="section-bottom">点击封面，体验随歌曲变化的背景</p></section><section class="section"><header class="section-head"><div><h2>我喜欢的音乐</h2><p>那些值得反复聆听的时刻</p></div><button class="text-button" data-list>查看全部 ${icon('arrow-right')}</button></header><div class="cover-grid">${[list[5]||list[0],list[3]||list[0],list[1]||list[0],list[4]||list[0],list[0]].map(card).join('')}</div></section>`}
async function background(src,isAlbum){const ticket=++generation;const preload=new Image();preload.src=src;try{await preload.decode()}catch{if(ticket===generation){toast('封面不可用，显示默认背景');if(isAlbum)background('assets/default-scene.png',false)}return}if(ticket!==generation)return;const next=activeBg==='a'?'b':'a',img=$('bg-'+next);img.src=src;img.className=isAlbum?'album':'';requestAnimationFrame(()=>{if(ticket!==generation)return;img.classList.add('visible');$('bg-'+activeBg).classList.remove('visible');activeBg=next})}
function update(){const s=songs[current];$('app').classList.toggle('has-track',!!s);$('idle').setAttribute('aria-pressed',String(!s));$('demo').setAttribute('aria-pressed',String(!!s));$('track-title').textContent=s?s.title:'选择内容开始播放';$('track-artist').textContent=s?`${s.artist} · ${playing?'模拟播放中':'已暂停'}`:'Music Bridge';$('player-art').innerHTML=s?`<img src="${s.cover}" alt="当前曲目示意封面">`:icon('music-note-beamed');$('play').innerHTML=icon(playing?'pause-fill':'play-fill');$('play').setAttribute('aria-label',playing?'暂停模拟播放':s?'恢复模拟播放':'模拟播放');$('previous').disabled=$('next').disabled=!s;$('state-note').innerHTML=s?`${playing?'播放中':'已暂停'} · ${s.title}<br>${playing?'全窗口背景来自当前封面':'暂停保留当前封面背景'}`:'默认背景<br>选择一张封面，看看画面如何变化';render()}
function choose(id){const changed=current!==id;current=id;playing=true;if(changed)background(songs[id].cover,true);update()}
function idle(){current=-1;playing=false;background('assets/default-scene.png',false);update()}
document.addEventListener('click',e=>{const play=e.target.closest('[data-play]');if(play){const id=Number(play.dataset.play);if(id===current){playing=!playing;update()}else choose(id);return}const nav=e.target.closest('[data-page]');if(nav){if(!['主页','我喜欢的音乐'].includes(nav.dataset.page)){toast('本轮仅预览主页、收藏列表与背景切换');return}page=nav.dataset.page;$('search').value='';document.querySelectorAll('[data-page]').forEach(n=>{n.classList.toggle('active',n===nav);if(n===nav)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});render()}if(e.target.closest('[data-list]'))document.querySelector('[data-page="我喜欢的音乐"]').click()});
$('idle').onclick=idle;$('demo').onclick=()=>choose(current<0?1:current);$('play').onclick=()=>{if(current<0)choose(1);else{playing=!playing;update()}};$('next').onclick=()=>choose((current+1)%songs.length);$('previous').onclick=()=>choose((current+songs.length-1)%songs.length);$('search').oninput=render;
$('fold').onclick=()=>{const collapsed=!$('playlists').hidden;$('playlists').hidden=collapsed;$('fold').setAttribute('aria-expanded',String(!collapsed))};$('queue-toggle').onclick=()=>{$('queue').hidden=!$('queue').hidden;$('queue-toggle').setAttribute('aria-expanded',String(!$('queue').hidden))};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('queue').hidden){$('queue').hidden=true;$('queue-toggle').setAttribute('aria-expanded','false');$('queue-toggle').focus()}});
$('background-only').onclick=()=>{const hidden=$('app').classList.toggle('only-background');document.querySelector('.layout').inert=hidden;document.querySelector('.player').inert=hidden;$('background-only').setAttribute('aria-pressed',String(hidden));$('background-only').textContent=hidden?'返回界面':'查看背景';$('queue').hidden=true;$('queue-toggle').setAttribute('aria-expanded','false')};$('settings').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();$('try-blue').onclick=()=>{$('dialog').close();choose(1)};$('device').onclick=()=>toast('演示设备：Studio Display；不会连接或播放音频');$('quality').onchange=()=>toast('已切换预览音质，不影响真实播放器');
function setTheme(value){document.documentElement.classList.add('appearance-changing');document.documentElement.dataset.theme=value;requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('appearance-changing')));$('theme-select').value=value;try{localStorage.setItem('ambient-study.theme',value)}catch{}}
let savedTheme='light';try{savedTheme=localStorage.getItem('ambient-study.theme')||'light'}catch{}
setTheme(new URLSearchParams(location.search).get('theme')==='dark'?'dark':savedTheme==='dark'?'dark':'light');
$('theme-select').onchange=e=>setTheme(e.target.value);
update();if(new URLSearchParams(location.search).get('state')==='playing')choose(1);
</script></body></html>
