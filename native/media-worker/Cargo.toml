[package]
name = "musicbridge-media-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
base64 = "=0.22.1"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
lofty = { version = "=0.22.4", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
